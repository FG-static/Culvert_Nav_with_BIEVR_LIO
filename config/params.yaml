map:
  pixel_size_m: 0.05 # Pixel side length [m]
  voxel_size_m: 0.5 # Voxel side length [m]
  normal_tolerance_deg: 3 # Normal change threshold to trigger reprojection of voxel image [°]
  smooth: True # Apply smoothing to the voxel image
  weighted: True # Weighted pixel update
  max_size: 1500000 # Maximum number of voxels to keep in the map
  frame: "odom"

preprocess:
  downsample_resolution_m: 0.1 # Downsample points to this resolution [m]. In case of informed sampling, this
  # corresponds to the high resolution voxels
  informed_sampling: True

optimization:
  huber_delta: 0.1 # Huber norm threshold
  # Experimental Tunnel-D ablation: attenuate the weakest Htt-direction translation update.
  hard_project_weakest_translation: True
  # Retain alpha times the weak-direction update: 0 = hard projection, 1 = original LM update.
  weak_translation_retention_alpha: 1.0 # 该改进已失败
  # Attenuate only when lambda_min(Htt) / lambda_max(Htt) is below this threshold.
  translation_degeneracy_ratio_threshold: 0.05

imu:
    window_s: 10 # Time window for the inertial optimization [s]
    t_init: 0.2 # Time to initialize bias and gravity [s]
    frame: "imu"

wheel:
  enabled: False # Fuse wheel odometry as a velocity factor in the inertial window (topic/extrinsics in the sensor config)
  sigma_v: 0.15 # 1-sigma of the wheel velocity measurement [m/s]
  max_sync_delay_s: 0.05 # Wait this much sensor time for wheel data to bracket each LiDAR frame
  planar_only: True # Constrain only the body-frame x/y displacement (ground robots)
  estimate_scale: False # Estimate a shared multiplicative wheel scale (wheel radius error) in the window
  scale_prior_sigma: 0.1 # Prior 1-sigma on the wheel scale around 1
  # Slip monitor (v2 log-only; nothing is gated). Thresholds are first guesses —
  # re-calibrate from flooded-site bags before wiring them to the fusion.
  slip_abs_threshold_mps: 0.20 # SLIP entry needs |r_x| above this AND the relative bound below
  slip_rel_threshold: 0.35 # SLIP entry needs |r_x|/v_ref above this AND the absolute bound below
  slip_wz_threshold_rps: 0.30 # Yaw-rate channel high threshold (score only)
  slip_suspect_abs_mps: 0.12 # SUSPECT entry / recovery reference, absolute
  slip_suspect_rel: 0.20 # SUSPECT entry / recovery reference, relative
  slip_suspect_wz_rps: 0.18 # Yaw-rate low threshold (score only)
  slip_lidar_velocity_window_frames: 3 # Time-weighted LiDAR velocity smoothing history
  slip_high_window_frames: 5 # Sliding vote window for high residual frames
  slip_high_votes_required: 3 # K high frames required within the window
  slip_relative_min_speed_mps: 0.15 # Disable relative residual below this speed
  slip_recover_time_s: 0.75 # Below low for this long to return NORMAL (0.5-1)
  slip_speed_floor_mps: 0.1 # v_ref floor against low-speed ratio amplification

debug:
  publish_all_clouds: False # Publish all clouds (fine, coarse, deskewed)
  timing: False
  log: False
  dashboard: True # Fancy live status print (position, biases, timing, ...)
  dashboard_ascii_path: "" # ASCII art for the dashboard. Empty = bievr_ascii.txt next to the config.
  trajectory_path: "" # Path to save trajectory. If empty, logs will not be saved.
  # Per-frame registration observability/quality CSV. Empty disables the extra final-pose linearization.
  registration_metrics_path: ""
  # Per-frame wheel-slip consistency CSV (v2 log-only). Empty disables it.
  wheel_slip_path: ""

max_num_threads: 0 # 0 = automatic, >0 = number of threads to use for parallel processing
